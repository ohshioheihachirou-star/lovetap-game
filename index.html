<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Love Tap Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      width: 80%;
      max-width: 320px;
    }
    .heart-btn {
      font-size: 80px;
      cursor: pointer;
      margin: 20px 0;
      transition: transform 0.1s ease;
    }
    .heart-btn:active {
      transform: scale(0.85);
    }
    .score-title {
      font-size: 14px;
      color: #888;
      margin-bottom: 5px;
    }
    .score {
      font-size: 32px;
      font-weight: bold;
      color: #ff4757;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="score-title">好感度</div>
    <div class="score" id="score">0</div>
    <div class="heart-btn" id="tapBtn">❤️</div>
    <p style="font-size: 12px; color: #666;">タップして好感度を上げよう！</p>
  </div>

  <script>
    // Telegram Web Appの初期化
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand(); // アプリ画面を全画面表示
    }

    let count = 0;
    const scoreEl = document.getElementById('score');
    const tapBtn = document.getElementById('tapBtn');

    tapBtn.addEventListener('click', () => {
      count++;
      scoreEl.textContent = count;
      
      // Haptic Feedback（タップ時のバイブレーション機能）
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    });
  </script>
</body>
</html>
